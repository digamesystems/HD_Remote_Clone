; Hunter Douglas Platinum remote replacement — bring-up / reverse-engineering firmware
; Board: ESP32-DevKitC with ESP32-WROOM-32

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    crankyoldgit/IRremoteESP8266@2.8.6
    nrf24/RF24@1.4.11
