; Hunter Douglas Platinum remote replacement — bring-up / reverse-engineering firmware
; Board: ESP32-DevKitC with ESP32-WROOM-32D
;
; Testing (see TESTING.md):
;   pio test -e native                         Tier 1, host unit tests (no hardware)
;   pio test -e esp32dev --upload-port COM11   Tier 2, on-device tests (flashes test firmware)

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
test_speed = 115200
test_ignore = test_native_*
build_flags =
    -DCORE_DEBUG_LEVEL=0
; Test builds define UNIT_TEST, which puts IRremoteESP8266 in host-stub mode.
extra_scripts = pre:scripts/no_unit_test_define.py
lib_deps =
    SPI
    crankyoldgit/IRremoteESP8266@2.8.6
    nrf24/RF24@1.4.11

[env:native]
platform = native
test_ignore = test_device_*
build_flags =
    -std=gnu++17
    -Wall
